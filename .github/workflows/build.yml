name: Сборка

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Проверки и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: Проверки интерфейса (браузер)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  windows:
    name: Сборка для Windows (.exe)
    needs: [test, e2e]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: EchelonCommander-windows
          path: release/*.exe
          if-no-files-found: error
      # Настоящая программа из установочной сборки: запуск, файлы данных, правка перед закрытием, перезапуск.
      - name: Проверка собранной программы
        run: npm run test:app
        env:
          ECHELON_EXE: ${{ github.workspace }}\release\win-unpacked\Echelon Commander.exe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-test-report
          path: test-results/
          retention-days: 7

  release:
    name: Релиз на GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Версия тега совпадает с package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then echo "Тег v$tag, а в package.json $pkg"; exit 1; fi
      - name: Описание из CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: EchelonCommander-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          name: Echelon Commander ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*.exe
