# Матрица приказов. Для каждого приказа — набор модификаторов и условие
# выполнения задачи. Значения откалиброваны прогонами через cli.py:
# при равных батальонах «атака» против «обороны» выигрывает примерно в 30%
# случаев, встречный бой «атака–атака» даёт 50/50.
#
# attack/defense     — множители огня и устойчивости;
# visibility         — заметность носителя приказа (для обнаружения его противником);
# detection_speed    — скорость обнаружения противника;
# ammo_use/fuel_use  — множители расхода боезапаса и топлива;
# fatigue_gain       — множитель прироста усталости;
# morale_resistance  — устойчивость морали (делитель падения морали);
# initiative         — слагаемое к броску инициативы;
# disengage          — стремление выйти из контакта (0..1);
# task               — условие выполнения задачи:
#   kind: enemy_routed | hold_turns | ambush | recon | disengage | none
#   turns            — сколько ходов надо выстоять (hold_turns);
#   damage_ratio     — какую долю потерь нанести (ambush);
#   intel_level      — какой уровень разведданных набрать (recon);
#   personnel_ratio  — какую долю л/с сохранить (disengage/ambush).
schema_version: 1
