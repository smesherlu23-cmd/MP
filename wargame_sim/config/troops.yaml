# Типы солдат: кому что выдано. Из состава типа элемента
# (element_types.yaml: composition) по этим карточкам считается штат —
# численность, огневая мощь и устойчивость подразделения.
#
# folder     — папка библиотеки; пустая — «без папки»;
# gear       — обмундирование (запись из gear.yaml);
# weapon     — основное оружие (запись из weapons.yaml);
# secondary  — доп. оружие, пусто — нет (запись из weapons.yaml);
# ammo       — БК: сколько носит с собой, в условных единицах.
schema_version: 1

# Как комплект превращается в штат подразделения.
staff:
  secondary_share: 0.45     # с каким весом доп. оружие добавляет огневую мощь
  vehicle_firepower: 4.60   # с каким весом техника добавляет огневую мощь штата
  attack_scale: 1.10        # перевод суммарного огня в шкалу 0..100
  defense_base: 18.0        # устойчивость без брони и без техники
  defense_protection: 0.55  # вклад защищённости комплекта
  defense_vehicle: 1.10     # вклад брони машин
  fatigue_baseline: 1.1678  # база нагрузки комплекта (усталость)
  ammo_baseline: 1.1273     # база расхода боезапаса

folders: [Стрелковое отделение, Огневая поддержка, Специалисты, Управление]

