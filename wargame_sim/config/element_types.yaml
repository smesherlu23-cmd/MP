# Типы элементов подразделения. Значения — шаблон для конструктора и
# коэффициенты, которыми тип участвует в расчёте.
#
# label            — отображаемое название;
# combat           — боевой элемент (учитывается в проверке разгрома);
# hq               — штаб (даёт связь и влияние командира);
# supply_source    — тыл (подвозит боезапас и топливо в фазе восстановления);
# recon            — разведка (даёт прибавку к обнаружению всей стороне);
# target_priority  — привлекательность как цели при распределении огня;
# vulnerability    — уязвимость типа при распределении потерь;
# anti_tank        — доля огня, работающая по технике (0..1);
# detection        — множитель собственного обнаружения;
# stealth          — множитель собственной заметности (меньше — скрытнее);
# defaults.echelon — масштаб группы: отделение, взвод, рота, батальон, полк;
# defaults         — стартовые значения полей при добавлении из шаблона;
#                    vehicle_type/vehicle_count — штатная техника типа
#                    (запись из vehicles.yaml и сколько её по штату).
schema_version: 1
element_types:
  # --- малый масштаб ------------------------------------------------------
  # Бои чаще идут взводами и отделениями, чем батальонами, а мельче
  # разведвзвода в библиотеке ничего не было: ГМ брал роту и переписывал
  # численность руками. Числа этих типов считаются по составу, как у всех
  # остальных, — правка в библиотеке оружия видна сразу.
  отделение:
    staff_attack: 1.0
    staff_defense: 1.0
    composition:
      Командир: 1
      Пулемётчик: 1
      Гранатомётчик: 1
      Стрелок: 6
    label: Стрелковое отделение
    combat: true
    hq: false
    supply_source: false
    recon: false
    target_priority: 1.00
    vulnerability: 1.00
    anti_tank: 0.09
    detection: 1.00
    stealth: 1.00
    defaults:
      personnel_full: 9
      echelon: отделение
      attack: 38.2922
      defense: 36.7000
      vehicle_type: ""
      vehicle_count: 0
