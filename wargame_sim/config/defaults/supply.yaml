# Снабжение: расход боезапаса и топлива, подвоз, штрафы при нехватке.
# Итоговый расход = base_per_turn × множитель приказа (orders.yaml)
#                 × (1 + intensity_weight × интенсивность огня элемента).
schema_version: 1
supply:
  ammo:
    # 3.5, а не прежние 5.0: интенсивность огня перестала зависеть от
    # масштаба (раньше у отделения она была 0.05 против 2.4 у батальона),
    # и расход при старом основании съедал боезапас слишком быстро —
    # доля побед атаки просела с 28% до 19%.
    base_per_turn: 3.5
    intensity_weight: 0.60
    # Подвоз от живого тылового элемента. Обязан быть меньше расхода —
    # иначе боезапас за бой не тает, а растёт, и снабжение превращается в
    # украшение. При 8.5 так и было: расход у батальона 4.76 за ход против
    # подвоза 6.38, боезапас поднимался с 92 до 95, и рабочая часть кривой
    # (ниже 60) за 40 боёв встречалась дважды. При 4.5 баланс −1.37 за ход,
    # минимум за бой 40, конец 52 — то есть кривая работает у обоих
    # масштабов. Цена честная и измеренная: доля побед атаки у батальона
    # 23% → 19% (коридор 12…45%), потому что любое снижение общей
    # летальности играет за обороняющегося.
    resupply_per_turn: 4.5
    resupply_without_source: 0.0
    min: 0.0
    max: 100.0
    # k_боезапас(ammo)
    state_curve:
      - {x: 0.0, y: 0.10}
      - {x: 10.0, y: 0.45}
      - {x: 30.0, y: 0.80}
      - {x: 60.0, y: 1.00}
      - {x: 100.0, y: 1.05}
  fuel:
    base_per_turn: 4.0
    intensity_weight: 0.30
    resupply_per_turn: 6.0
    resupply_without_source: 0.0
    infantry_uses_fuel: false  # см. §15, вопрос 6 — топливо только для техники
    min: 0.0
    max: 100.0
    # k_топливо(fuel) — применяется к элементам с техникой
    state_curve:
      - {x: 0.0, y: 0.55}
      - {x: 15.0, y: 0.80}
      - {x: 40.0, y: 0.95}
      - {x: 100.0, y: 1.00}
  equipment:
    loss_per_turn: 0.8
    loss_per_casualty_share: 8.0
    resupply_per_turn: 0.45
    min: 0.0
    max: 100.0
    # k_снаряжение(equipment)
    state_curve:
      - {x: 0.0, y: 0.55}
      - {x: 30.0, y: 0.82}
      - {x: 70.0, y: 0.97}
      - {x: 100.0, y: 1.03}
  # Подвоз отряду, у которого своего тыла нет по штату: взвод и отделение
  # снабжает старшая часть, поэтому в бою малой группы боезапас не
  # обрывается на пятом ходу. Доля от обычного подвоза.
  # Это не то же самое, что выбитый тыл: если тыл в отряде был и его
  # уничтожили, подвоз прекращается совсем — это интересное событие боя.
  external_supply_share: 0.55
  # Множитель подвоза, если тыловой элемент подавлен/обескровлен
  # Даже подавленный тыл что-то подвозит, поэтому кривая не падает в ноль:
  # снабжение обрывается, когда тыловой элемент выбит, а не когда прижат.
  source_efficiency_curve:
    - {x: 0.0, y: 0.15}
    - {x: 40.0, y: 0.75}
    - {x: 100.0, y: 1.0}
