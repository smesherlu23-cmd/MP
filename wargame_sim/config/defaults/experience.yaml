# Множители уровней опыта (1 — новобранцы, 4 — ветераны).
#
# Разброс намеренно узкий: combat входит в K_сост и умножает и огонь,
# и устойчивость, поэтому преимущество возводится почти в квадрат.
# При прежнем 0.80…1.25 опыт был не шкалой, а переключателем: третий
# уровень давал 100% побед, первый — 0%. Разница ветеранов и
# новобранцев держится не столько огнём, сколько разбросом огня
# (curves.noise_experience), спадом подавления, обнаружением и
# инициативой — там она и должна быть заметной.
# combat              — вклад в коэффициент состояния;
# morale_resistance   — делитель падения морали;
# detection           — множитель обнаружения;
# suppression_recovery— прибавка к спаду подавления: спад = k × (1 + это);
# initiative          — слагаемое к броску инициативы;
schema_version: 1
experience:
  1:
    combat: 0.96
    morale_resistance: 0.96
    detection: 0.85
    suppression_recovery: 0.80
    initiative: 0.00
  2:
    combat: 0.985
    morale_resistance: 1.00
    detection: 1.00
    suppression_recovery: 1.00
    initiative: 0.50
  3:
    combat: 1.010
    morale_resistance: 1.04
    detection: 1.15
    suppression_recovery: 1.20
    initiative: 1.00
  4:
    combat: 1.030
    morale_resistance: 1.08
    detection: 1.35
    suppression_recovery: 1.45
    initiative: 1.75
