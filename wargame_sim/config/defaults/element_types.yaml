# Типы элементов подразделения. Значения — шаблон для конструктора и
# коэффициенты, которыми тип участвует в расчёте.
#
# label            — отображаемое название;
# combat           — боевой элемент (учитывается в проверке разгрома);
# hq               — штаб (даёт связь и влияние командира);
# supply_source    — тыл (подвозит боезапас и топливо в фазе восстановления);
# recon            — разведка (даёт прибавку к обнаружению всей стороне);
# target_priority  — привлекательность как цели при распределении огня;
# vulnerability    — уязвимость типа при распределении потерь;
# anti_tank        — доля огня, работающая по технике (0..1);
# detection        — множитель собственного обнаружения;
# stealth          — множитель собственной заметности (меньше — скрытнее);
# defaults         — стартовые значения полей при добавлении из шаблона.
schema_version: 1
element_types:
  стрелковая_рота:
    label: Стрелковая рота
    combat: true
