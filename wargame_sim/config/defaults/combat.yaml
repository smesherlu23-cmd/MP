# Ядро расчёта: летальность, потолки, экспоненты, обнаружение, инициатива,
# подавление, техника, проверки конца хода.
schema_version: 1
combat:
  # --- Потери в личном составе -------------------------------------------
  casualties:
    lethality: 0.030          # k_летальность
    pressure_exponent: 0.80   # γ
    cap_per_turn: 0.35        # потолок доли потерь за ход
    defense_epsilon: 1.0      # ε в знаменателе давления
    first_strike_bonus: 1.20  # бонус стороне, выигравшей инициативу
    noise:                    # случайный множитель огня
      min: 0.85
      max: 1.15

  # --- Потери в технике ---------------------------------------------------
  vehicles:
    lethality: 0.030
    pressure_exponent: 0.85
    cap_per_turn: 0.30
    defense_epsilon: 1.0
    condition_share: 0.55      # доля выбитой техники, уходящая в повреждение
    condition_loss_per_hit: 22.0
    disabled_below_condition: 20.0  # ниже этого condition машина не считается боеспособной
    crew_loss_per_vehicle: 1.5      # л/с, теряемый вместе с уничтоженной машиной
    abandoned_on_panic: 0.70        # доля техники, брошенной при панике

  # --- Обнаружение --------------------------------------------------------
  detection:
    base: 1.0
    intel:
      нет: 0.70
      частичные: 1.00
      полные: 1.30
    recon_element_bonus: 0.25   # прибавка за каждый живой разведэлемент стороны
    recon_bonus_cap: 0.60
    contact_thresholds:         # значение обнаружения → уровень контакта
      частичный: 0.55
      полный: 1.05
    target_share:               # доля элементов противника, доступных как цели
      нет: 0.0
      частичный: 0.55
      полный: 1.0
    accuracy:                   # множитель огня по уровню контакта
      нет: 0.0
      частичный: 0.70
      полный: 1.0
    intel_gain_per_turn: 0.12   # прирост уровня разведданных за ход контакта
    intel_levels: [нет, частичные, полные]

  # --- Инициатива ---------------------------------------------------------
  initiative:
    cohesion_weight: 2.0
    intel:
      нет: 0.0
      частичные: 0.75
      полные: 1.50
    roll:
      min: 0.0
      max: 4.0
    ambush_bonus: 5.0           # приоритет засады в первый ход контакта
    readiness_weight: 1.5

  # --- Выбор целей --------------------------------------------------------
  targeting:
    priority_exponent: 1.0      # степень веса target_priority
    noise:
      min: 0.85
      max: 1.15
    min_weight: 0.02
    hq_focus_bonus: 1.0         # дополнительный вес штабу при полном контакте
    supply_focus_bonus: 1.0

  # --- Подавление ---------------------------------------------------------
  suppression:
    gain: 18.0                  # k_подавление × Давление
    gain_exponent: 0.85
    recovery: 11.0              # k_восстановление
    min: 0.0
    max: 95.0

  # --- Кривые коэффициента состояния --------------------------------------
  curves:
    # k_связь(эффективная связь = cohesion × communications/100)
    cohesion:
      - {x: 0.0, y: 0.45}
      - {x: 30.0, y: 0.72}
      - {x: 60.0, y: 0.92}
      - {x: 100.0, y: 1.05}
    # k_командир(commander_influence)
    commander:
      - {x: 0.0, y: 0.88}
      - {x: 50.0, y: 1.00}
      - {x: 100.0, y: 1.12}
    # k_готовность(readiness)
    readiness:
      - {x: 0.0, y: 0.70}
      - {x: 50.0, y: 0.92}
      - {x: 100.0, y: 1.05}
    # k_состояние_техники(средний condition техники элемента)
    vehicle_condition:
      - {x: 0.0, y: 0.55}
      - {x: 40.0, y: 0.82}
      - {x: 70.0, y: 0.95}
      - {x: 100.0, y: 1.00}
    # k_укрепление(fortification 0..5)
    fortification:
      - {x: 0.0, y: 1.00}
      - {x: 1.0, y: 1.12}
      - {x: 2.0, y: 1.25}
      - {x: 3.0, y: 1.40}
      - {x: 4.0, y: 1.55}
      - {x: 5.0, y: 1.75}
    # Дополнительное укрытие от укреплений (складывается с укрытием местности)
    fortification_cover:
      - {x: 0.0, y: 0.00}
      - {x: 5.0, y: 0.25}

  # --- Проверки конца хода ------------------------------------------------
  checks:
    rout_personnel_ratio: 0.40   # порог разгрома по доле л/с от исходной
    element_dead_personnel_ratio: 0.25  # ниже — элемент небоеспособен
    panic_pursuit_losses: 0.30   # доп. потери при паническом бегстве
    disengage_threshold: 2.50    # накопленный выход из контакта для «вышел из боя»
    default_max_turns: 30
    max_cover: 0.85
