# Ядро расчёта: летальность, потолки, экспоненты, обнаружение, инициатива,
# подавление, техника, проверки конца хода.
schema_version: 1
combat:
  # --- Потери в личном составе -------------------------------------------
  casualties:
    # Летальность подобрана так, чтобы исход решал бой: при 0.01 истощение
    # не успевало ни к чему привести за отведённые ходы, и всё упиралось в
    # задачу обороны — секундомер вместо боя.
    lethality: 0.016          # k_летальность
    pressure_exponent: 0.80   # γ
    cap_per_turn: 0.35        # потолок доли потерь за ход
    defense_epsilon: 1.0      # ε в знаменателе давления
    first_strike_bonus: 1.20  # бонус стороне, выигравшей инициативу
    noise:                    # случайный множитель огня
      min: 0.85
      max: 1.15

  # --- Потери в технике ---------------------------------------------------
  vehicles:
    lethality: 0.030
    pressure_exponent: 0.85
    cap_per_turn: 0.30
    defense_epsilon: 1.0
    condition_share: 0.55      # доля выбитой техники, уходящая в повреждение
    condition_loss_per_hit: 22.0
    disabled_below_condition: 20.0  # ниже этого condition машина не считается боеспособной
    crew_loss_share: 0.55           # доля экипажа из карточки, уходящая в потери
    breakdown_per_turn: 1.20        # небоевой износ за ход при нулевой надёжности
    abandoned_on_panic: 0.70        # доля техники, брошенной при панике

  # --- Обнаружение --------------------------------------------------------
  detection:
    base: 1.0
    intel:
      нет: 0.70
      частичные: 1.00
      полные: 1.30
    recon_element_bonus: 0.25   # прибавка за каждый живой разведэлемент стороны
    recon_bonus_cap: 0.60
    contact_thresholds:         # значение обнаружения → уровень контакта
      частичный: 0.55
      полный: 1.05
    target_share:               # доля элементов противника, доступных как цели
      нет: 0.0
      частичный: 0.55
      полный: 1.0
    accuracy:                   # множитель огня по уровню контакта
      нет: 0.0
      частичный: 0.70
      полный: 1.0
    intel_gain_per_turn: 0.12   # прирост уровня разведданных за ход контакта
    intel_levels: [нет, частичные, полные]

  # --- Инициатива ---------------------------------------------------------
  initiative:
    cohesion_weight: 2.0
    intel:
      нет: 0.0
      частичные: 0.75
      полные: 1.50
    roll:
      min: 0.0
      max: 4.0
    ambush_bonus: 5.0           # приоритет засады в первый ход контакта
    readiness_weight: 1.5

  # --- Выбор целей --------------------------------------------------------
  targeting:
    priority_exponent: 1.0      # степень веса target_priority
    noise:
      min: 0.85
      max: 1.15
    min_weight: 0.02
    hq_focus_bonus: 0.5         # дополнительный вес штабу при полном контакте
    supply_focus_bonus: 0.35

  # --- Подавление ---------------------------------------------------------
  suppression:
    gain: 18.0                  # k_подавление × Давление
    gain_exponent: 0.85
    recovery: 11.0              # k_восстановление
    min: 0.0
    max: 95.0

  # --- Слаженность --------------------------------------------------------
  # Способность действовать как целое. Ломают потери и подавление, собирает
  # обратно только время вне контакта. Входит в K_сост через curves.cohesion,
  # в разброс огня через curves.noise_cohesion и в инициативу.
  cohesion:
    loss_per_casualty_share: 90.0   # доля потерь за ход → сколько теряется
    loss_per_suppression: 0.07      # прирост подавления за ход → сколько теряется
    recovery_per_turn: 2.5          # сбор вне контакта
    min: 5.0
    max: 100.0

  # --- Готовность ---------------------------------------------------------
  # Способность выполнить новый приказ прямо сейчас. Тратится на команды ГМ,
  # поэтому перестроение посреди боя имеет цену, а не бесплатно.
  readiness:
    order_change_cost: 22.0
    split_cost: 28.0
    merge_cost: 18.0
    commit_cost: 14.0
    recovery_per_turn: 7.0
    min: 0.0
    max: 100.0

  # --- Кривые коэффициента состояния --------------------------------------
  curves:
    # k_связь(эффективная связь = cohesion × communications/100)
    cohesion:
      - {x: 0.0, y: 0.45}
      - {x: 30.0, y: 0.72}
      - {x: 60.0, y: 0.92}
      - {x: 100.0, y: 1.05}
    # k_командир(commander_influence)
    commander:
      - {x: 0.0, y: 0.88}
      - {x: 50.0, y: 1.00}
      - {x: 100.0, y: 1.12}
    # k_готовность(readiness)
    readiness:
      - {x: 0.0, y: 0.70}
      - {x: 50.0, y: 0.92}
      - {x: 100.0, y: 1.05}
    # k_состояние_техники(средний condition техники элемента)
    vehicle_condition:
      - {x: 0.0, y: 0.55}
      - {x: 40.0, y: 0.82}
      - {x: 70.0, y: 0.95}
      - {x: 100.0, y: 1.00}
    # k_укрепление(fortification 0..5)
    fortification:
      - {x: 0.0, y: 1.00}
      - {x: 1.0, y: 1.12}
      - {x: 2.0, y: 1.25}
      - {x: 3.0, y: 1.40}
      - {x: 4.0, y: 1.55}
      - {x: 5.0, y: 1.75}
    # Дополнительное укрытие от укреплений (складывается с укрытием местности)
    fortification_cover:
      - {x: 0.0, y: 0.00}
      - {x: 5.0, y: 0.25}
    # Обвал обороны: множитель потерь в зависимости от давления.
    # Растёт плавно и монотонно. Скачка тут быть не должно: раньше колено
    # стояло на 1.20, а медианное давление в бою было 1.21 — модель
    # балансировала на лезвии, и любой модификатор перебрасывал её через
    # обрыв, превращая «в лесу тяжелее» в «в лесу невозможно».
    # Концентрация огня по-прежнему выгодна, но выигрыш идёт плавно.
    collapse:
      - {x: 0.00, y: 0.80}
      - {x: 1.00, y: 1.00}
      - {x: 3.00, y: 1.35}
      - {x: 8.00, y: 1.80}
      - {x: 20.00, y: 2.20}
      - {x: 40.00, y: 2.40}
    # Ширина случайного множителя огня. Итоговый множитель ширины —
    # произведение трёх кривых: выученный, слаженный и не подавленный
    # элемент стреляет предсказуемо, новобранцы под огнём — как придётся.
    # Центр диапазона не двигается, поэтому средние потери те же.
    # k_разброс(опыт 1..4)
    noise_experience:
      - {x: 1.0, y: 1.90}
      - {x: 2.0, y: 1.35}
      - {x: 3.0, y: 1.00}
      - {x: 4.0, y: 0.78}
    # k_разброс(эффективная слаженность = cohesion × communications/100)
    noise_cohesion:
      - {x: 0.0, y: 1.45}
      - {x: 40.0, y: 1.15}
      - {x: 70.0, y: 1.00}
      - {x: 100.0, y: 0.90}
    # k_разброс(подавление)
    noise_suppression:
      - {x: 0.0, y: 1.00}
      - {x: 40.0, y: 1.20}
      - {x: 100.0, y: 1.60}
    # k_броня(средняя броня машин цели 0..100) — во сколько раз тяжелее
    # пробить технику. Единице соответствует лёгкая бронемашина.
    armour:
      - {x: 0.0, y: 0.80}
      - {x: 22.0, y: 1.00}
      - {x: 40.0, y: 1.25}
      - {x: 82.0, y: 2.20}
      - {x: 100.0, y: 2.60}
    # k_заметность(средняя заметность машин элемента) — насколько сильнее
    # элемент притягивает огонь.
    visibility:
      - {x: 0.0, y: 0.90}
      - {x: 50.0, y: 1.00}
      - {x: 100.0, y: 1.25}

  # --- Проверки конца хода ------------------------------------------------
  checks:
    rout_personnel_ratio: 0.40   # порог разгрома по доле л/с от исходной
    element_dead_personnel_ratio: 0.25  # ниже — элемент небоеспособен
    panic_pursuit_losses: 0.30   # доп. потери при паническом бегстве
    disengage_threshold: 4.00    # накопленный выход из контакта для «вышел из боя»:
                                 # отрыв занимает несколько ходов под огнём, а не два
    default_max_turns: 30
    max_cover: 0.85
