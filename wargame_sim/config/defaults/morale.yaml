# Мораль: веса факторов изменения, пороги, кривая влияния на боеспособность.
#
# Δмораль = − k1×доля_потерь_за_ход
#         − k2×прирост_подавления
#         − k3×доля_потерь_техники
#         − k4×(1, если элемент вне контакта со штабом)
#         + k5×commander_influence
#         + k6×k_опыт
#         + k7×(успех своей стороны в ходу)
# Отрицательная часть делится на устойчивость (приказ × опыт).
schema_version: 1
morale:
  weights:
    k1_casualties: 50.0
    k2_suppression: 0.12
    k3_vehicle_losses: 30.0
    k4_no_hq: 2.5
    k5_commander: 0.030
    k6_experience: 1.60
    k7_side_success: 3.50
  thresholds:
    retreat: 30.0
    panic: 10.0
  recovery_per_turn: 1.20
  min: 0.0
  max: 100.0
  # k_мораль(morale) — вклад морали в коэффициент состояния элемента
  state_curve:
    - {x: 0.0, y: 0.30}
    - {x: 20.0, y: 0.55}
    - {x: 50.0, y: 0.88}
    - {x: 75.0, y: 1.00}
    - {x: 100.0, y: 1.10}
