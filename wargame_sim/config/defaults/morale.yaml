# Мораль: веса факторов изменения, пороги, кривая влияния на боеспособность.
#
# Δмораль = k7×(успех своей стороны в ходу)
#         − (k1×доля_потерь_за_ход
#            + k2×прирост_подавления
#            + k3×доля_потерь_техники
#            + k4×(1, если элемент вне контакта со штабом)) / устойчивость
#
# устойчивость = приказ × опыт × командир (curves.commander_resistance).
#
# Важно: положительных слагаемых «просто так» здесь нет. Командир и опыт
# держат мораль, а не начисляют её: иначе рота под огнём набирала бы
# мораль каждый ход — ровно это и было до перекалибровки.
schema_version: 1
morale:
  weights:
    k1_casualties: 44.0
    k2_suppression: 0.12
    k3_vehicle_losses: 30.0
    k4_no_hq: 2.5
    # Успех в ходу — единственный способ удержать мораль. Вес большой
    # намеренно: на входе разница долей потерь (0.01…0.03), и при прежних
    # 3.5 победитель не получал за победу ничего. Отсюда и расхождение
    # сторон: кто ломает противника, тот держится сам.
    k7_side_success: 190.0
  # Во сколько раз командир держит мораль (x — commander_influence 0..100).
  commander_resistance:
    - {x: 0.0, y: 0.80}
    - {x: 50.0, y: 1.00}
    - {x: 100.0, y: 1.30}
  # Подразделение перестаёт воевать задолго до нулевой морали: ждать
  # «ровно нуля» — значит перемалывать обе стороны до конца и выдавать
  # победителя с нулевой боеспособностью.
  thresholds:
    retreat: 35.0
    panic: 20.0
  # Мораль восстанавливается только вне контакта — под огнём не рассыпаются,
  # но и не приходят в себя. Та же оговорка, что у отдыха от усталости.
  recovery_per_turn: 1.20
  min: 0.0
  max: 100.0
  # k_мораль(morale) — вклад морали в коэффициент состояния элемента
  state_curve:
    - {x: 0.0, y: 0.30}
    - {x: 20.0, y: 0.55}
    - {x: 50.0, y: 0.88}
    - {x: 75.0, y: 1.00}
    - {x: 100.0, y: 1.10}
