# Модификаторы местности.
#
# Местность входит в обмен потерями ровно один раз — через `cover`, и
# симметрично: лес укрывает обоих. Поэтому она меняет цену и длительность
# боя, а не исход. Перевес обороняющегося делают приказ (orders.yaml) и
# укрепления (они задаются каждой стороне отдельно).
#
# Разброс укрытия сдержанный: любое снижение общей летальности играет
# за обороняющегося (ему достаточно выстоять), поэтому широкий разброс
# снова превращает тяжёлую местность в невозможную.
#
# detection — базовая заметность (чем меньше, тем труднее обнаружить);
# fatigue   — множитель прироста усталости;
# speed     — множитель подвижности (влияет на выход из контакта);
# cover     — доля потерь, поглощаемая укрытием (0..0.95).
schema_version: 1
terrain:
  равнина:
    detection: 1.20
    fatigue: 0.95
    speed: 1.10
    cover: 0.05
  холмы:
    detection: 0.95
    fatigue: 1.10
    speed: 0.90
    cover: 0.10
  лес:
    detection: 0.70
    fatigue: 1.15
    speed: 0.75
    cover: 0.15
  застройка:
    detection: 0.75
    fatigue: 1.05
    speed: 0.70
    cover: 0.19
  болото:
    detection: 0.85
    fatigue: 1.35
    speed: 0.50
    cover: 0.07
