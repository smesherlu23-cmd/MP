# Усталость: прирост, восстановление и влияние на боеспособность.
#
# Прирост подобран под длительность боя: при 4.0 + 3.5 за ход усталость
# упиралась в потолок к четырнадцатому ходу и переставала различать
# подразделения — параметр, который у всех равен ста, ничего не значит.
schema_version: 1
fatigue:
  gain_per_turn: 2.2        # базовый прирост за ход
  gain_in_contact: 2.0      # добавка за ход в огневом контакте
  gain_per_casualty_share: 12.0  # добавка от собственных потерь за ход
  recovery_per_turn: 2.5    # спад вне контакта
  recovery_experience_weight: 0.35  # добавка к спаду от опыта
  min: 0.0
  max: 100.0
  # k_усталость(fatigue) — вклад усталости в коэффициент состояния
  state_curve:
    - {x: 0.0, y: 1.05}
    - {x: 25.0, y: 1.00}
    - {x: 50.0, y: 0.90}
    - {x: 75.0, y: 0.75}
    - {x: 100.0, y: 0.55}
