# Матрица приказов. Для каждого приказа — набор модификаторов и условие
# выполнения задачи. Значения откалиброваны прогонами через cli.py:
# при равных отрядах «атака» против «обороны» выигрывает примерно в 23%
# случаев, встречный бой «атака–атака» даёт 50/50 на 200 прогонах.
# У каждого приказа обязаны быть и победы, и поражения: приказ, который
# выигрывает всегда, — это не механика, а её отсутствие.
#
# attack/defense     — множители огня и устойчивости;
# visibility         — заметность носителя приказа (для обнаружения его противником);
# detection_speed    — скорость обнаружения противника;
# ammo_use/fuel_use  — множители расхода боезапаса и топлива;
# fatigue_gain       — множитель прироста усталости;
# morale_resistance  — устойчивость морали (делитель падения морали);
# initiative         — слагаемое к броску инициативы;
# disengage          — стремление выйти из контакта (0..1);
# task               — условие выполнения задачи:
#   kind: enemy_routed | hold_turns | ambush | recon | disengage | none
#   turns            — сколько ходов надо выстоять (hold_turns);
#   damage_ratio     — какую долю потерь нанести (ambush);
#   intel_level      — какой уровень разведданных набрать (recon);
#   personnel_ratio  — какую долю л/с сохранить (disengage/ambush).
schema_version: 1

# Сколько ходов держится задача «выстоять», зависит от масштаба отряда:
# взвод решает свой бой за минуты, батальон — за часы. Множитель к
# task.turns. У батальона он равен 1.00, поэтому батальонная калибровка
# (атака против обороны — около 23%) от этой таблицы не зависит.
scale_turns:
  звено: 0.40
  отделение: 0.45
  взвод: 0.55
  рота: 0.75
  батальон: 1.00
  полк: 1.25
orders:
  атака:
    attack: 1.30
    defense: 0.82
    visibility: 1.15
    detection_speed: 1.10
    ammo_use: 1.10
    fuel_use: 1.30
    fatigue_gain: 1.15
    # Наступать под огнём тяжелее для морали, чем сидеть в окопе: раньше
    # у атаки устойчивость была выше, чем у обороны, и это переворачивало
    # весь баланс, как только мораль начала работать.
    morale_resistance: 1.00
    initiative: 1.50
    disengage: 0.00
    task:
      kind: enemy_routed
  оборона:
    attack: 0.92
    defense: 1.42
    visibility: 0.92
    detection_speed: 1.00
    ammo_use: 1.00
    fuel_use: 0.60
    fatigue_gain: 0.90
    morale_resistance: 1.50
    initiative: 0.00
    disengage: 0.00
    task:
      # Задача-подстраховка, а не секундомер: держится дольше, чем идёт
      # типичный бой, поэтому исход решает бой, а счётчик — только те
      # случаи, когда атака выдохлась и никто никого не сломал.
      kind: hold_turns
      turns: 22
  засада:
    # Задача засады — нанести урон и уйти. Планка должна быть настоящей:
    # при damage_ratio 0.25 засада выполнялась всегда и давала 100% побед.
    attack: 1.10
    defense: 0.95
    visibility: 0.85
    detection_speed: 1.20
    ammo_use: 1.05
    fuel_use: 0.50
    fatigue_gain: 0.85
    morale_resistance: 1.10
    initiative: 2.00
    disengage: 0.35
    task:
      kind: ambush
      damage_ratio: 0.40
      personnel_ratio: 0.82
  разведка:
    attack: 0.55
    defense: 0.85
    visibility: 0.55
    detection_speed: 1.60
    ammo_use: 0.55
    fuel_use: 0.90
    fatigue_gain: 1.05
    morale_resistance: 1.00
    initiative: 1.00
    disengage: 0.25
    task:
      kind: recon
      intel_level: полные
  закрепление:
    # Прочнее обороны по построению: если окопаться выгоднее, чем просто
    # обороняться, у приказа появляется смысл. Раньше было наоборот —
    # закрепившийся проигрывал обороняющемуся в ста процентах случаев.
    attack: 0.70
    defense: 1.56
    visibility: 0.80
    detection_speed: 0.90
    ammo_use: 0.90
    fuel_use: 0.50
    fatigue_gain: 0.80
    morale_resistance: 1.62
    initiative: -0.50
    disengage: 0.00
    task:
      kind: hold_turns
      turns: 22
  отступление:
    attack: 0.45
    defense: 0.85
    visibility: 1.10
    detection_speed: 0.80
    ammo_use: 0.50
    fuel_use: 1.20
    fatigue_gain: 1.20
    morale_resistance: 0.85
    initiative: -1.50
    disengage: 1.00
    task:
      # Отход удался, если оторвались и сохранили людей. Порог сохранения
      # высокий: уйти из-под огня, потеряв треть отряда, — это не
      # выполненная задача, а бегство, которое просто назвали отходом.
      kind: disengage
      personnel_ratio: 0.75
  паническое бегство:
    attack: 0.10
    defense: 0.35
    visibility: 1.40
    detection_speed: 0.50
    ammo_use: 0.20
    fuel_use: 1.40
    fatigue_gain: 1.50
    morale_resistance: 0.50
    initiative: -3.00
    disengage: 0.90
    task:
      kind: none
