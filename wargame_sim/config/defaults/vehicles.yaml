# Библиотека техники. На запись отсюда ссылается группа техники внутри
# элемента (`vehicle_type`), поэтому БТР и танк в одной роте считаются
# по-разному: у них своя броня, своя пушка и свой экипаж.
#
# class          — класс машины, только для группировки в интерфейсе;
# crew           — экипаж, чел.: столько теряется вместе с машиной;
# armour_front   — лобовая защита 0..100, работает против огня с фронта;
# armour_side    — бортовая защита 0..100, работает в засаде и при охвате;
# firepower      — вклад машины в огонь по пехоте, 0..100;
# anti_tank      — противотанковая мощь, 0..100;
# mobility       — подвижность 0..100: отрыв от противника и проходимость;
# visibility     — заметность 0..100: насколько машина притягивает огонь;
# reliability    — надёжность 0..100: чем ниже, тем чаще небоевые поломки;
# fuel_use       — множитель расхода топлива;
# transport      — сколько человек пехоты возит (0 — не возит);
# folder         — папка библиотеки; пустая — «без папки».
schema_version: 1

# Папки библиотеки. Пустая папка тоже живёт здесь, поэтому список.
folders: [Танки, Бронемашины пехоты, Бронетранспортёры, Артиллерия, Транспорт]

