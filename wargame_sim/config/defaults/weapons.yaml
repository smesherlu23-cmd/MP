# Пехотное вооружение. На запись отсюда ссылается тип солдата
# (troops.yaml: weapon и secondary), а через него — штат типа элемента.
#
# class      — класс оружия, для группировки и для понятных подписей;
# folder     — папка библиотеки; пустая — «без папки»;
# crew       — расчёт, чел.: столько человек обслуживают одну единицу;
# firepower  — огневая мощь по пехоте, 0..100;
# anti_tank  — противотанковая мощь, 0..100;
# range      — относительная дальность 0..100: на что хватает выстрела;
# ammo_use   — множитель расхода боезапаса.
schema_version: 1

# Папки библиотеки. Пустая папка тоже живёт здесь, поэтому список.
folders: [Стрелковое, Пулемёты, Противотанковое, Огневая поддержка]

weapons:
